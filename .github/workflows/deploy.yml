name: Build and deploy

# Jeden przebieg buduje APK, paczkę OTA i stronę. Na GitHub Pages trafiają:
#   /AlcoCalc.apk            – APK (stały adres bez przekierowań)
#   /ota/latest.json + .zip  – aktualizacja OTA dla zainstalowanych APK
# APK jest też publikowane w Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wersja: 1.<poziom części natywnej>.<numer buildu>. Poziom podbijamy w android/NATIVE_LEVEL,
      # gdy zmienia się coś, czego OTA nie dowiezie (pluginy, ikona, ustawienia Androida).
      - name: Wersja
        run: |
          LEVEL=$(tr -dc '0-9' < android/NATIVE_LEVEL)
          VERSION="1.$LEVEL.${{ github.run_number }}"
          echo "NATIVE_LEVEL=$LEVEL" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Wersja $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test

      # --- APK + paczka OTA (ta sama wersja webowa) ---
      - run: npm run build:android

      - name: Paczka OTA
        run: |
          (cd dist && zip -qr "$RUNNER_TEMP/ota.zip" .)
          echo "OTA_SHA256=$(sha256sum "$RUNNER_TEMP/ota.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Klucz podpisu z sekretów
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/alcocalc-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/alcocalc-release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sprawdź podpis
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -2
          cp "$APK" "$RUNNER_TEMP/AlcoCalc.apk"
          rm -f "$RUNNER_TEMP/alcocalc-release.p12"

      # --- strona (PWA) + APK pod https://<login>.github.io/<repo>/AlcoCalc.apk ---
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - name: APK i OTA na stronę
        run: |
          cp "$RUNNER_TEMP/AlcoCalc.apk" dist/AlcoCalc.apk
          mkdir -p dist/ota
          cp "$RUNNER_TEMP/ota.zip" "dist/ota/$VERSION_NAME.zip"
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cat > dist/ota/latest.json <<JSON
          {
            "version": "$VERSION_NAME",
            "nativeLevel": $NATIVE_LEVEL,
            "bundle": "$PAGES/ota/$VERSION_NAME.zip",
            "checksum": "$OTA_SHA256"
          }
          JSON
          cat dist/ota/latest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publikacja w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/AlcoCalc.apk" AlcoCalc.apk
          gh release create "v$VERSION_NAME" AlcoCalc.apk \
            --target "$GITHUB_SHA" \
            --title "AlcoCalc $VERSION_NAME (Android)" \
            --notes "Pobieranie na telefonie: https://fiboczinajdid.github.io/AlcoCalc/apk/" \
            --latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
