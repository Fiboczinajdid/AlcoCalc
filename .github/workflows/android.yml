name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test

      # Wersja webowa w trybie „native” (bez service workera) + kopiowanie do projektu Androida.
      - run: npm run build:android

      - name: Klucz podpisu z sekretów
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/alcocalc-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/alcocalc-release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sprawdź podpis
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          cp "$APK" AlcoCalc.apk
          rm -f "$RUNNER_TEMP/alcocalc-release.p12"

      - name: Publikacja w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" AlcoCalc.apk \
            --target "$GITHUB_SHA" \
            --title "AlcoCalc $VERSION_NAME (Android)" \
            --notes "Plik AlcoCalc.apk do instalacji na Androidzie. Nowa wersja instaluje się jako aktualizacja – dane zostają." \
            --latest
